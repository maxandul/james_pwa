{% extends 'base.html' %}
{% block content %}
<section class="panel form-panel"><p class="eyebrow">WILLKOMMEN BEI JAMES</p><h1>Gemeinsam zuhause.</h1><p class="muted">Richte deinen persoenlichen Zugang mit deiner Einladung ein.</p>{% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Einladungscode<input id="invitation-token" name="token" required maxlength="100" autocomplete="off" value="{{ request.form.get('token', '') }}"><small>Wird beim Oeffnen deines Einladungslinks automatisch eingesetzt.</small></label><label>Dein Name<input name="name" required maxlength="80" autocomplete="name" value="{{ request.form.get('name', '') }}"></label><label>E-Mail-Adresse<input name="email" type="email" required maxlength="254" autocomplete="username" value="{{ request.form.get('email', '') }}"></label><label>Dein Passwort<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><small>Mindestens 12 Zeichen.</small></label><button class="button button--primary" type="submit">Zugang einrichten</button></form></section>
{% endblock %}
