<fieldset class="recipe-ingredient-editor"><legend>Zutat</legend><div class="recipe-fields"><label>Zutat<input name="ingredient_name" maxlength="100" value="{{ row.get('name','') }}" placeholder="z. B. Mehl" list="recipe-items"></label><label>Menge<input name="ingredient_amount" inputmode="decimal" value="{{ row.get('amount','') }}" placeholder="z. B. 300"></label><label>Einheit<input name="ingredient_unit" maxlength="30" value="{{ row.get('unit','') }}" placeholder="g, dl, Stück …"></label></div><details {% if row.get('item') or row.get('group') or row.get('detail') or row.get('staple') == '1' %}open{% endif %}><summary>Zuordnung, Gruppe und Zusatz</summary><div class="recipe-fields"><label>Haushaltsartikel<select name="ingredient_item"><option value="">Automatisch über Namen zuordnen</option>{% for item in items %}<option value="{{ item.id }}" {% if row.get('item') == item.id|string %}selected{% endif %}>{{ item.name }}{{ ' (archiviert)' if item.archived }} · {{ item.category }} · {{ item.source }}</option>{% endfor %}</select></label><label>Gruppe<input name="ingredient_group" maxlength="60" value="{{ row.get('group','') }}" placeholder="z. B. Sauce"></label><label>Zusatz<input name="ingredient_detail" maxlength="160" value="{{ row.get('detail','') }}" placeholder="z. B. fein gehackt"></label><label>Grundvorrat<select name="ingredient_staple"><option value="0">Bestandsstatus verwenden</option><option value="1" {% if row.get('staple') == '1' %}selected{% endif %}>Als vorhanden annehmen</option></select></label></div></details><button class="button button--quiet" type="button" data-remove-ingredient hidden>Zutat entfernen</button></fieldset>
